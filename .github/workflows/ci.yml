# CI fuer BelegTool. Befehle entsprechen dem "Full preflight" in CLAUDE.md (Abschnitt Tests).
# Plan und Begruendung: docs/test-automation-plan.md
#
# - Keine Secrets, kein pull_request_target; Token nur lesend.
# - Actions sind auf feste Hauptversionen gepinnt (Commit-SHAs waren beim Anlegen nicht belastbar
#   abrufbar). Dependabot (.github/dependabot.yml, woechentlich, github-actions) schlaegt Updates vor; SHA-Pinning bleibt offen.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python-Suite: muss auf Windows laufen (pywin32/pythonnet/Windows-only Tests; ~24 Tests scheitern auf Linux).
  # Office-Tests (marker "office") ueberspringen sich selbst, wenn Word/Excel/PowerPoint fehlen.
  pytest:
    name: pytest (Python 3.13, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6 # feste Hauptversion
        with:
          lfs: true # tests/data/** und *.pdf liegen in Git LFS
      - uses: actions/setup-python@v6 # feste Hauptversion
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: datev-dokab pruefen (installiert, nicht editierbar)
        run: python -I -c "import datev, datev.inapp"
      - name: belegtool-archives pruefen (installiert, nicht editierbar)
        run: python -I -c "import belegtool_archives, belegtool_archives.archives"
      - name: Hauptrepo-Weiterleitungen auf belegtool-archives pruefen
        # bewusst OHNE -I: infra/ und universal_importer/ liegen im Repo-Verzeichnis (cwd)
        run: python -c "import infra.limits, universal_importer.archives"
      - name: belegtool-compress pruefen (installiert, nicht editierbar)
        run: python -I -c "import belegtool_compress, belegtool_compress.compress, belegtool_compress.cpu, belegtool_compress.raster"
      - name: Hauptrepo-Weiterleitungen auf belegtool-compress pruefen
        # bewusst OHNE -I: formats/ und services/ liegen im Repo-Verzeichnis (cwd)
        run: python -c "import formats.compress_pdf_bytes, services.cpu"
      - name: pytest
        run: python -m pytest

  # Raster-Paritaet pypdfium2 (Produktion) gegen PyMuPDF (nur Dev-Orakel), Messwerkzeug + Paritaetstests.
  # Grundlage/Schwellen: docs/pdfium-spike.md. Zeitmessung (speed) und Latenz sind absichtlich NICHT im CI
  # (geteilte Runner = verrauscht); Thread-Sicherheit/Prioritaet sind per pytest abgedeckt.
  raster-parity:
    name: raster-parity pdfium vs PyMuPDF (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      # Die Paritaets-/pdfium-Tests des Pakets laufen jetzt im Repo belegtool-compress (eigene CI dort).
      - name: pypdfium2 + belegtool-compress + PyMuPDF (Orakel, dev) + numpy
        run: python -m pip install -r requirements-dev.txt "belegtool-compress @ git+https://github.com/tobiasheinrichfaska/belegtool-compress.git@v0.1.0" pypdfium2==5.15.2 Pillow pikepdf pypdf
      - name: scripts/raster_compare.py (Masse, Abweichung, Versatz, JPEG-Groessen, Speicher)
        run: python scripts/raster_compare.py --only dims,align,jpeg,memory

  # Der ausgelieferte Abhaengigkeitssatz (nur requirements.txt, OHNE PyMuPDF) rendert und komprimiert.
  no-pymupdf-runtime:
    name: Laufzeit ohne PyMuPDF (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Smoke - Vorschau + Kompression, fitz darf nicht installierbar/importierbar sein
        run: python scripts/smoke_no_pymupdf.py

  # Plattformneutrale Frontend-Teile: lint, Vitest (jsdom), Produktions-Build.
  webui:
    name: webui lint + vitest + build (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6 # feste Hauptversion
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test # vitest run; Pool 'vmThreads' ist in vite.config.js fest verdrahtet
      - run: npm run build

  # Playwright-e2e (echtes Chromium, Stub-Bridge). Braucht die echten LFS-PDFs (z. B. public/spike-link.pdf).
  e2e:
    name: Playwright e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:csp # CSP-Guard (Production-Build + vite preview, Port 5179)
      - name: Playwright-Spuren hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4 # feste Hauptversion
        with:
          name: playwright-test-results
          path: webui/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Optional/manuell: baut die Exe wie build.ps1 (ohne venv-Neuaufbau) und prueft das Bundle.
  # Startet die GUI NICHT (dafuer ist ein spaeterer GUI-Job vorgesehen, siehe Plan).
  exe-smoke:
    name: PyInstaller-Exe bauen + Bundle pruefen (manuell)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: webui bauen
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: PyInstaller
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller belegtool.spec --distpath dist --workpath build --noconfirm
      - name: Bundle pruefen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in 'dist\BelegTool\BelegTool.exe',
                         'dist\BelegTool\_internal\webui\dist\index.html',
                         'dist\BelegTool\_internal\webui\dist\pdfjs\wasm') {
            if (-not (Test-Path $p)) { throw "fehlt im Bundle: $p" }
          }
          Write-Host 'Bundle vollstaendig.'
