# CI fuer BelegTool. Befehle entsprechen dem "Full preflight" in CLAUDE.md (Abschnitt Tests).
# Plan und Begruendung: docs/test-automation-plan.md
#
# - Keine Secrets, kein pull_request_target; Token nur lesend.
# - Actions sind auf feste Hauptversionen gepinnt (Commit-SHAs waren beim Anlegen nicht belastbar
#   abrufbar). TODO: per Dependabot (ecosystem github-actions) auf SHAs umstellen.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Python-Suite: muss auf Windows laufen (pywin32/pythonnet/Windows-only Tests; ~24 Tests scheitern auf Linux).
  # Office-Tests (marker "office") ueberspringen sich selbst, wenn Word/Excel/PowerPoint fehlen.
  pytest:
    name: pytest (Python 3.13, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6 # feste Hauptversion
        with:
          lfs: true # tests/data/** und *.pdf liegen in Git LFS
      - uses: actions/setup-python@v6 # feste Hauptversion
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: datev-dokab pruefen (installiert, nicht editierbar)
        run: python -I -c "import datev, datev.inapp"
      - name: belegtool-archives pruefen (installiert, nicht editierbar)
        run: python -I -c "import belegtool_archives, belegtool_archives.archives; import infra.limits, universal_importer.archives"
      - name: pytest
        run: python -m pytest

  # datev-dokab (packages/datev-dokab): Paket-Tests in Isolation - nur das Paket installiert,
  # das Hauptrepo liegt nicht auf dem Pfad. Spaeter 1:1 in das eigene Repo uebernehmbar.
  datev-dokab:
    name: datev-dokab (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/datev-dokab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest

  # belegtool-archives (packages/belegtool-archives): Paket-Tests in Isolation - nur das Paket (+ Extra msg)
  # installiert, das Hauptrepo liegt nicht auf dem Pfad. Spaeter 1:1 in das eigene Repo uebernehmbar.
  belegtool-archives:
    name: belegtool-archives (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/belegtool-archives
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest

  # Plattformneutrale Frontend-Teile: lint, Vitest (jsdom), Produktions-Build.
  webui:
    name: webui lint + vitest + build (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6 # feste Hauptversion
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test # vitest run; Pool 'vmThreads' ist in vite.config.js fest verdrahtet
      - run: npm run build

  # Playwright-e2e (echtes Chromium, Stub-Bridge). Braucht die echten LFS-PDFs (z. B. public/spike-link.pdf).
  e2e:
    name: Playwright e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Playwright-Spuren hochladen (bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4 # feste Hauptversion
        with:
          name: playwright-test-results
          path: webui/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Optional/manuell: baut die Exe wie build.ps1 (ohne venv-Neuaufbau) und prueft das Bundle.
  # Startet die GUI NICHT (dafuer ist ein spaeterer GUI-Job vorgesehen, siehe Plan).
  exe-smoke:
    name: PyInstaller-Exe bauen + Bundle pruefen (manuell)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: webui bauen
        working-directory: webui
        run: |
          npm ci
          npm run build
      - name: PyInstaller
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller belegtool.spec --distpath dist --workpath build --noconfirm
      - name: Bundle pruefen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($p in 'dist\BelegTool\BelegTool.exe',
                         'dist\BelegTool\_internal\webui\dist\index.html',
                         'dist\BelegTool\_internal\webui\dist\pdfjs\wasm') {
            if (-not (Test-Path $p)) { throw "fehlt im Bundle: $p" }
          }
          Write-Host 'Bundle vollstaendig.'
