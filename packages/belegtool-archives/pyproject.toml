[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "belegtool-archives"
version = "0.1.0"
description = "Bomb-guarded extraction of ZIP/TAR/TGZ/EML/MSG containers into a nested document structure"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# GPLv3 (!): see README "Licensing note". Without it .msg degrades to "nicht importierbar".
msg = ["extract-msg==0.55.0"]
dev = ["pytest", "extract-msg==0.55.0"]

[tool.setuptools]
packages = ["belegtool_archives"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
