[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datev-dokab"
version = "0.1.0"
description = "Headless DATEVconnect Dokumentenablage (DMS v2) client with guarded write-back"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["datev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
