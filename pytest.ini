[pytest]
# Coverage is opt-in — run `pytest --cov=. --cov-report=term` explicitly. It is deliberately NOT in
# addopts: hard-requiring pytest-cov there aborts the ENTIRE suite ("unrecognized arguments: --cov")
# on any runner without the plugin (e.g. the .build_venv / system-python test paths).
# All tests live under tests/. An explicit testpaths keeps a bare `pytest` from
# recursing into scratch copies: `norecursedirs = funktional` (the old line)
# REPLACED pytest's default excludes (.* build dist node_modules), so a repo copy
# under .tmp/ produced 69 "import file mismatch" collection errors (2026-11-01).
testpaths = tests

markers =
    office: real-Office COM round-trip (needs Word/Excel/PowerPoint installed).
        Runs in the DEFAULT suite; auto-skips on non-Windows / where the app
        isn't installed. Opt out of just these with `pytest -m "not office"`.

filterwarnings =
    ignore:.*SwigPyPacked has no __module__.*:DeprecationWarning
    ignore:.*SwigPyObject has no __module__.*:DeprecationWarning
    ignore:.*swigvarlink has no __module__.*:DeprecationWarning

[coverage:run]
omit =
    funktional/*
    tests/test_alt_*.py
